services:

  CategoryDb:
    image: mongo:latest
    container_name: CategoryDb
    ports:
      - "27017:27017"
    volumes:
      - categorydb_data:/data/db
      - categorydb_config:/data/configdb
    restart: always

  DiscountDB:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: DiscountDB
    ports:
      - "1442:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    restart: always

  BasketDb:
    image: redis:latest
    container_name: BasketDb
    ports:
      - "6379:6379"
    volumes:
      - basketdb_data:/data
    restart: always

  CargoDb:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: CargoDb
    ports:
      - "1441:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    restart: always

  IdentityDb:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: IdentityDb
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    restart: always

  OrderDb:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: OrderDb
    ports:
      - "1440:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    restart: always

volumes:
  categorydb_data:
  categorydb_config:
  basketdb_data:
